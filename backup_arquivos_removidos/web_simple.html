<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧑‍🍳 Chef RAG - Sistema Inteligente de Receitas</title>
    <meta name="description" content="Transforme ingredientes em receitas incríveis com IA">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧑‍🍳</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 2rem;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .header h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: white;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .header p {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.9);
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
        }

        .card h2 {
            color: #4a5568;
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .upload-area {
            border: 2px dashed #cbd5e0;
            border-radius: 10px;
            padding: 2rem;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            margin-bottom: 1rem;
        }

        .upload-area:hover {
            border-color: #667eea;
            background-color: #f7fafc;
        }

        .upload-area.dragover {
            border-color: #667eea;
            background-color: #ebf8ff;
        }

        .file-input {
            display: none;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: transform 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .ingredients-input {
            width: 100%;
            padding: 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            margin-bottom: 1rem;
            min-height: 120px;
            resize: vertical;
        }

        .results {
            grid-column: span 2;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: #667eea;
        }

        .recipe-card {
            background: #f8fafc;
            border-left: 4px solid #667eea;
            padding: 1.5rem;
            margin-bottom: 1rem;
            border-radius: 8px;
        }

        .recipe-title {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
            color: #2d3748;
        }

        .recipe-info {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            color: #666;
        }

        .recipe-ingredients, .recipe-steps {
            margin-bottom: 1rem;
        }

        .recipe-ingredients h4, .recipe-steps h4 {
            margin-bottom: 0.5rem;
            color: #4a5568;
        }

        .recipe-ingredients ul, .recipe-steps ol {
            padding-left: 1.5rem;
        }

        .recipe-ingredients li, .recipe-steps li {
            margin-bottom: 0.3rem;
        }

        .status {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
        }

        .status.success {
            background-color: #f0fff4;
            color: #38a169;
            border: 1px solid #9ae6b4;
        }

        .status.error {
            background-color: #fed7d7;
            color: #e53e3e;
            border: 1px solid #feb2b2;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .results {
                grid-column: span 1;
            }
            
            .header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧑‍🍳 Chef RAG</h1>
            <p>Transforme ingredientes em receitas incríveis com Inteligência Artificial</p>
        </div>

        <div class="main-content">
            <!-- Análise por Imagem -->
            <div class="card">
                <h2>📷 Análise por Imagem</h2>
                <div class="upload-area" onclick="document.getElementById('imageFile').click()">
                    <input type="file" id="imageFile" class="file-input" accept="image/*" onchange="handleImageUpload(event)">
                    <p>📁 Clique aqui ou arraste uma imagem</p>
                    <small>Formatos: JPG, PNG, WEBP</small>
                </div>
                <button class="btn" onclick="analyzeImage()" id="analyzeBtn" disabled>
                    🔍 Analisar Ingredientes
                </button>
            </div>

            <!-- Busca por Texto -->
            <div class="card">
                <h2>✍️ Busca por Texto</h2>
                <textarea 
                    class="ingredients-input" 
                    id="ingredientsText" 
                    placeholder="Digite os ingredientes que você tem (ex: tomate, cebola, frango, arroz...)"
                    oninput="toggleTextSearch()"
                ></textarea>
                <button class="btn" onclick="searchByText()" id="textSearchBtn" disabled>
                    🔍 Buscar Receitas
                </button>
            </div>

            <!-- Resultados -->
            <div class="card results">
                <h2>🍽️ Resultados</h2>
                <div id="results">
                    <p style="text-align: center; color: #666; padding: 2rem;">
                        📝 Faça upload de uma imagem ou digite ingredientes para começar
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:5000/api';
        let selectedFile = null;

        // Configurar drag & drop
        const uploadArea = document.querySelector('.upload-area');
        
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFileSelection(files[0]);
            }
        });

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                handleFileSelection(file);
            }
        }

        function handleFileSelection(file) {
            if (!file.type.startsWith('image/')) {
                showStatus('❌ Por favor, selecione um arquivo de imagem válido.', 'error');
                return;
            }

            selectedFile = file;
            document.getElementById('analyzeBtn').disabled = false;
            
            const uploadArea = document.querySelector('.upload-area');
            uploadArea.innerHTML = `
                <p>✅ ${file.name}</p>
                <small>Clique em "Analisar Ingredientes" para continuar</small>
            `;
            
            showStatus('📁 Imagem carregada com sucesso!', 'success');
        }

        function toggleTextSearch() {
            const text = document.getElementById('ingredientsText').value.trim();
            document.getElementById('textSearchBtn').disabled = text.length === 0;
        }

        async function analyzeImage() {
            if (!selectedFile) {
                showStatus('❌ Por favor, selecione uma imagem primeiro.', 'error');
                return;
            }

            const analyzeBtn = document.getElementById('analyzeBtn');
            analyzeBtn.disabled = true;
            analyzeBtn.innerHTML = '⏳ Analisando...';

            const formData = new FormData();
            formData.append('image', selectedFile);

            try {
                showLoading('🔍 Analisando ingredientes da imagem...');
                
                const response = await fetch(`${API_BASE_URL}/analyze-image`, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                
                if (data.success) {
                    displayResults(data.recipes || [], `Ingredientes detectados: ${data.ingredients.join(', ')}`);
                    showStatus('✅ Análise concluída com sucesso!', 'success');
                } else {
                    showStatus(`❌ Erro: ${data.message}`, 'error');
                    document.getElementById('results').innerHTML = '<p style="text-align: center; color: #666;">❌ Erro na análise da imagem</p>';
                }
            } catch (error) {
                console.error('Erro:', error);
                showStatus('❌ Erro de conexão. Verifique se a API está rodando.', 'error');
                document.getElementById('results').innerHTML = '<p style="text-align: center; color: #666;">❌ Erro de conexão com a API</p>';
            } finally {
                analyzeBtn.disabled = false;
                analyzeBtn.innerHTML = '🔍 Analisar Ingredientes';
            }
        }

        async function searchByText() {
            const ingredients = document.getElementById('ingredientsText').value.trim();
            
            if (!ingredients) {
                showStatus('❌ Por favor, digite alguns ingredientes.', 'error');
                return;
            }

            const textSearchBtn = document.getElementById('textSearchBtn');
            textSearchBtn.disabled = true;
            textSearchBtn.innerHTML = '⏳ Buscando...';

            try {
                showLoading('🔍 Buscando receitas baseadas nos ingredientes...');
                
                const response = await fetch(`${API_BASE_URL}/recipes/search`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        ingredients: ingredients.split(',').map(i => i.trim())
                    })
                });

                const data = await response.json();
                
                if (data.success) {
                    displayResults(data.recipes || [], `Busca por: ${ingredients}`);
                    showStatus('✅ Busca concluída com sucesso!', 'success');
                } else {
                    showStatus(`❌ Erro: ${data.message}`, 'error');
                    document.getElementById('results').innerHTML = '<p style="text-align: center; color: #666;">❌ Erro na busca</p>';
                }
            } catch (error) {
                console.error('Erro:', error);
                showStatus('❌ Erro de conexão. Verifique se a API está rodando.', 'error');
                document.getElementById('results').innerHTML = '<p style="text-align: center; color: #666;">❌ Erro de conexão com a API</p>';
            } finally {
                textSearchBtn.disabled = false;
                textSearchBtn.innerHTML = '🔍 Buscar Receitas';
            }
        }

        function showLoading(message) {
            document.getElementById('results').innerHTML = `
                <div class="loading">
                    <p style="font-size: 1.2rem; margin-bottom: 1rem;">${message}</p>
                    <div style="display: inline-block; width: 20px; height: 20px; border: 3px solid #667eea; border-radius: 50%; border-top-color: transparent; animation: spin 1s ease-in-out infinite;"></div>
                </div>
                <style>
                    @keyframes spin {
                        to { transform: rotate(360deg); }
                    }
                </style>
            `;
        }

        function displayResults(recipes, subtitle) {
            const resultsDiv = document.getElementById('results');
            
            if (!recipes || recipes.length === 0) {
                resultsDiv.innerHTML = `
                    <p style="text-align: center; color: #666;">
                        😔 Nenhuma receita encontrada.<br>
                        <small>${subtitle}</small>
                    </p>
                `;
                return;
            }

            let html = `<p style="margin-bottom: 1.5rem; color: #666;"><strong>${subtitle}</strong></p>`;
            
            recipes.forEach(recipe => {
                html += `
                    <div class="recipe-card">
                        <div class="recipe-title">${recipe.titulo || recipe.name || 'Receita'}</div>
                        <div class="recipe-info">
                            <span>⏱️ ${recipe.tempo_preparo || '30 min'}</span>
                            <span>👥 ${recipe.porcoes || '4 porções'}</span>
                            <span>⭐ ${recipe.rating || 'N/A'}</span>
                        </div>
                        
                        ${recipe.ingredientes ? `
                            <div class="recipe-ingredients">
                                <h4>🥘 Ingredientes:</h4>
                                <ul>
                                    ${recipe.ingredientes.map(ing => `<li>${ing}</li>`).join('')}
                                </ul>
                            </div>
                        ` : ''}
                        
                        ${recipe.modo_preparo ? `
                            <div class="recipe-steps">
                                <h4>👩‍🍳 Modo de Preparo:</h4>
                                <ol>
                                    ${recipe.modo_preparo.map(step => `<li>${step}</li>`).join('')}
                                </ol>
                            </div>
                        ` : ''}
                        
                        ${recipe.observacoes ? `
                            <p><strong>💡 Dica:</strong> ${recipe.observacoes}</p>
                        ` : ''}
                    </div>
                `;
            });

            resultsDiv.innerHTML = html;
        }

        function showStatus(message, type) {
            // Remover status anterior
            const existingStatus = document.querySelector('.status');
            if (existingStatus) {
                existingStatus.remove();
            }

            const status = document.createElement('div');
            status.className = `status ${type}`;
            status.textContent = message;
            
            document.querySelector('.container').appendChild(status);
            
            // Remover após 5 segundos
            setTimeout(() => {
                if (status.parentNode) {
                    status.remove();
                }
            }, 5000);
        }

        // Verificar se API está rodando
        async function checkAPI() {
            try {
                const response = await fetch(`${API_BASE_URL}/health`);
                if (response.ok) {
                    showStatus('✅ Conectado com a API do Chef RAG!', 'success');
                }
            } catch (error) {
                showStatus('⚠️ API não está rodando. Execute: python api.py', 'error');
            }
        }

        // Verificar API ao carregar
        checkAPI();
    </script>
</body>
</html>
